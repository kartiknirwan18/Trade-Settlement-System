# ---------------------------------------------------------------------------
# Local development / smoke-test profile backed by in-memory H2 (MySQL mode).
# Start with:  --spring.profiles.active=dev
# The schema is generated from the JPA entities so the application can run
# without a MySQL server. Flyway is disabled for this profile only.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:settlement;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

settlement:
  security:
    jwt:
      # Development-only fallback so the app can start without extra setup.
      # Override with the JWT_SECRET environment variable in any real deployment.
      secret: ${JWT_SECRET:dev-only-insecure-secret-key-change-me-please-32b}

logging:
  level:
    com.example.settlement: DEBUG
